<? var _url=(typeof scriptUrl!=='undefined')?scriptUrl:'';var _token=(typeof token!=='undefined')?token:'';var _page=(typeof page!=='undefined')?page:'';var _role=(typeof userRole!=='undefined')?userRole:'';var _name=(typeof userName!=='undefined')?userName:'User';var _site=(typeof userSite!=='undefined')?userSite:'-'; ?>
<aside id="appSidebar">
  <div class="brand-box d-flex justify-content-between align-items-center"><div><div class="brand-title">HSE <span class="hide-on-mini">MONITORING</span></div><small class="hide-on-mini text-white-50 fw-bold" style="font-size:10.5px;">Batubara Incident System</small></div><button type="button" class="btn btn-sm text-white d-lg-none p-0 border-0" onclick="toggleSidebar()" title="Tutup Menu"><i class="bi bi-x-lg fs-4"></i></button></div>
  <div class="nav-menu flex-grow-1"><a href="<?= _url ?>?token=<?= _token ?>&page=Dashboard" class="nav-btn <?= (_page==='Dashboard')?'active':'' ?>" title="Dashboard"><i class="bi bi-grid-fill"></i><span class="hide-on-mini">Dashboard</span></a><a href="<?= _url ?>?token=<?= _token ?>&page=IncidentList" class="nav-btn <?= (_page==='IncidentList')?'active':'' ?>" title="Data Laporan"><i class="bi bi-file-earmark-text-fill"></i><span class="hide-on-mini">Data Laporan</span></a><a href="<?= _url ?>?token=<?= _token ?>&page=IncidentInput" class="nav-btn <?= (_page==='IncidentInput')?'active':'' ?>" title="Input Insiden"><i class="bi bi-plus-circle-fill"></i><span class="hide-on-mini">Input Insiden</span></a><? if(String(_role).toLowerCase()==='admin'){ ?><a href="<?= _url ?>?token=<?= _token ?>&page=MasterData" class="nav-btn <?= (_page==='MasterData')?'active':'' ?>" title="Master Data"><i class="bi bi-database-fill-gear"></i><span class="hide-on-mini">Master Data</span></a><? } ?></div>
  <div class="pt-3 border-top border-white-20"><div class="hide-on-mini mb-2"><div class="fw-bold text-white" style="font-size:13.5px;"><?= _name ?></div><small class="text-white-50 d-block" style="font-size:11px;">Site: <strong><?= _site ?></strong> | Role: <strong><?= _role ?></strong></small></div><button onclick="logout()" class="btn btn-sm btn-light text-danger w-100 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" title="Keluar / Logout"><i class="bi bi-box-arrow-right fs-6"></i><span class="hide-on-mini">Keluar / Logout</span></button></div>
</aside>
<script>
function toggleSidebar(){const sidebar=document.getElementById('appSidebar'),mainContent=document.getElementById('mainContent');if(!sidebar)return;if(window.innerWidth<992)sidebar.classList.toggle('show-mobile');else{sidebar.classList.toggle('mini-sidebar');if(mainContent)mainContent.classList.toggle('mini-content')}}
function logout(){google.script.run.withSuccessHandler(()=>{window.top.location.href="<?= _url ?>";}).logoutSession("<?= _token ?>")}

(function(){
  const LIST_PAGE=<?= JSON.stringify(_page) ?>;
  const LIST_TOKEN=<?= JSON.stringify(_token) ?>;
  const LIST_URL=<?= JSON.stringify(_url) ?>;
  const LIST_ROLE=<?= JSON.stringify(_role) ?>;
  if(LIST_PAGE!=='IncidentList') return;

  const isAdmin=String(LIST_ROLE||'').trim().toLowerCase()==='admin';
  const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));

  function detailUrl(id){return LIST_URL+'?token='+encodeURIComponent(LIST_TOKEN)+'&page=IncidentDetail&id='+encodeURIComponent(id)}
  function editUrl(id){return LIST_URL+'?token='+encodeURIComponent(LIST_TOKEN)+'&page=IncidentEdit&id='+encodeURIComponent(id)}

  function getIncidentId(row){
    const cell=row.children[0];
    return cell ? String(cell.textContent||'').replace(/\s+/g,' ').trim() : '';
  }

  function normalizeStatus(row){
    const cell=row.children[6];
    return cell ? String(cell.textContent||'').trim().toLowerCase() : '';
  }

  function replaceActions(){
    const tbody=document.getElementById('listTableBody');
    if(!tbody)return;
    tbody.querySelectorAll('tr').forEach(row=>{
      const cells=row.children;
      if(cells.length<8)return;
      const action=cells[7];
      if(action.dataset.actionsReady==='1')return;
      const id=getIncidentId(row);
      if(!id || id==='-')return;

      const status=normalizeStatus(row);
      const isClosed=status==='close' || status==='closed';
      const wrap=document.createElement('div');
      wrap.className='incident-action-wrap';

      let html='<a class="btn btn-sm btn-outline-primary" href="'+detailUrl(id)+'" title="Lihat detail"><i class="bi bi-eye"></i> Detail</a>';
      if(!isClosed || isAdmin){
        html+='<a class="btn btn-sm btn-outline-warning" href="'+editUrl(id)+'" title="Edit laporan"><i class="bi bi-pencil"></i> Edit</a>';
        html+='<button type="button" class="btn btn-sm btn-outline-success" data-action="update" title="Update laporan"><i class="bi bi-check2-circle"></i> Update</button>';
        html+='<button type="button" class="btn btn-sm btn-outline-danger" data-action="delete" title="Hapus laporan"><i class="bi bi-trash"></i> Delete</button>';
      }
      wrap.innerHTML=html;

      const update=wrap.querySelector('[data-action="update"]');
      const del=wrap.querySelector('[data-action="delete"]');
      if(update)update.onclick=()=>openCloseModal(id);
      if(del)del.onclick=()=>deleteIncidentFromList(id);

      action.innerHTML='';
      action.appendChild(wrap);
      action.dataset.actionsReady='1';
    });
  }

  function observeList(){
    const tbody=document.getElementById('listTableBody');
    if(!tbody){setTimeout(observeList,100);return;}
    replaceActions();
    const observer=new MutationObserver(()=>replaceActions());
    observer.observe(tbody,{childList:true,subtree:true});
  }

  function modal(){
    let b=document.getElementById('incidentCloseModal');
    if(b)return b;
    b=document.createElement('div');
    b.id='incidentCloseModal';
    b.className='incident-modal-backdrop';
    b.innerHTML='<div class="incident-modal"><div class="d-flex justify-content-between align-items-center mb-3"><h5>Update Laporan</h5><button type="button" class="btn-close" data-close></button></div><div class="meta mb-3"><div><span class="text-muted">No. Insiden</span><br><strong id="closeIncidentId"></strong></div><div class="mt-2"><span class="text-muted">Status Setelah Update</span><br><span class="badge bg-success">CLOSE</span></div></div><label class="form-label fw-bold">Lampiran Penyelesaian <span class="text-muted fw-normal">(opsional)</span></label><input type="file" id="closeFile" class="form-control mb-3"><label class="form-label fw-bold">Catatan Penyelesaian</label><textarea id="closeNote" class="form-control mb-3" placeholder="Masukkan catatan penyelesaian..."></textarea><div class="d-flex justify-content-end gap-2"><button type="button" class="btn btn-outline-secondary" data-close>Batal</button><button type="button" class="btn btn-danger" id="closeSubmit"><i class="bi bi-check2-circle me-1"></i>Update & Close</button></div></div>';
    document.body.appendChild(b);
    b.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>b.classList.remove('show'));
    return b;
  }

  function openCloseModal(id){
    const b=modal();
    b.dataset.incidentId=id;
    b.querySelector('#closeIncidentId').textContent=id;
    b.querySelector('#closeFile').value='';
    b.querySelector('#closeNote').value='';
    b.classList.add('show');
    b.querySelector('#closeSubmit').onclick=()=>submitClose(b);
  }

  function setSubmitBusy(btn,busy){
    btn.disabled=busy;
    btn.innerHTML=busy?'<span class="spinner-border spinner-border-sm me-1"></span>Memproses...':'<i class="bi bi-check2-circle me-1"></i>Update & Close';
  }

  function submitClose(b){
    const id=b.dataset.incidentId;
    const file=b.querySelector('#closeFile').files[0];
    const note=b.querySelector('#closeNote').value.trim();
    const btn=b.querySelector('#closeSubmit');
    setSubmitBusy(btn,true);
    const finish=()=>{
      google.script.run.withSuccessHandler(r=>{
        if(typeof r==='string')try{r=JSON.parse(r)}catch(e){}
        if(!r||!r.success){setSubmitBusy(btn,false);alert(r?.message||'Laporan gagal ditutup.');return}
        b.classList.remove('show');
        window.location.reload();
      }).withFailureHandler(()=>{setSubmitBusy(btn,false);alert('Laporan gagal ditutup. Silakan coba lagi.')}).updateIncidentStatus(LIST_TOKEN,id,'Close',note);
    };
    if(!file){finish();return;}
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const dataUrl=String(reader.result||'');
        const base64=dataUrl.split(',')[1]||'';
        google.script.run.withSuccessHandler(r=>{
          if(typeof r==='string')try{r=JSON.parse(r)}catch(e){}
          if(!r||!r.success){setSubmitBusy(btn,false);alert(r?.message||'Lampiran gagal diupload. Silakan coba lagi.');return}
          finish();
        }).withFailureHandler(()=>{setSubmitBusy(btn,false);alert('Lampiran gagal diupload. Silakan coba lagi.')}).uploadAttachment(LIST_TOKEN,id,{bytes:base64,mimeType:file.type,fileName:file.name},'Penyelesaian');
      }catch(e){setSubmitBusy(btn,false);alert('Lampiran gagal diproses. Silakan coba lagi.')}
    };
    reader.readAsDataURL(file);
  }

  function deleteIncidentFromList(id){
    if(!confirm('Hapus laporan '+id+'?\n\nData yang sudah dihapus tidak dapat dikembalikan.'))return;
    google.script.run.withSuccessHandler(r=>{
      if(typeof r==='string')try{r=JSON.parse(r)}catch(e){}
      if(!r||!r.success){alert(r?.message||'Laporan gagal dihapus.');return}
      window.location.reload();
    }).withFailureHandler(()=>alert('Laporan gagal dihapus. Silakan coba lagi.')).deleteIncident(LIST_TOKEN,id);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',observeList);else observeList();
})();
</script>
