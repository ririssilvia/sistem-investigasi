<!-- SIDEBAR COMPONENT (MERAH SINARMAS & RESPONSIVE TOGGLE) -->
<style>
  :root {
    --red-sinarmas: #e31e24;
    --red-dark-sidebar: #b81419;
    --red-active-item: #900c11;
  }

  /* Sidebar Styling - Merah Sinarmas Solid */
  .sidebar {
    width: 260px;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    background: linear-gradient(180deg, var(--red-sinarmas) 0%, var(--red-dark-sidebar) 100%);
    color: #ffffff;
    padding: 20px 16px;
    z-index: 1000;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
  }

  /* KONDISI SIDEBAR HIDDEN (DITUTUP) */
  .sidebar.collapsed {
    transform: translateX(-100%);
  }

  /* Penyesuaian Main Content saat Sidebar Ditutup/Buka */
  .main-content {
    margin-left: 260px;
    transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .main-content.expanded {
    margin-left: 0 !important;
  }

  /* Logo & Title */
  .brand-box {
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    margin-bottom: 20px;
  }

  .brand-title {
    font-size: 18px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.5px;
  }

  /* Navigasi Menu Items */
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 16px;
    color: rgba(255, 255, 255, 0.85);
    background: transparent;
    border: none;
    text-decoration: none;
    border-radius: 8px;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
  }

  .nav-btn.active {
    background: #ffffff;
    color: var(--red-sinarmas) !important;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  }

  .nav-btn i {
    font-size: 18px;
  }

  .nav-btn.active i {
    color: var(--red-sinarmas);
  }

  /* Mobile Responsive adjustments */
  @media (max-width: 991px) {
    .sidebar {
      transform: translateX(-100%);
    }
    .sidebar.show-mobile {
      transform: translateX(0);
    }
    .main-content {
      margin-left: 0 !important;
    }
  }
</style>

<!-- SCRIPT RESPONSIVE HIDE / SHOW SIDEBAR -->
<script>
  function toggleSidebar() {
    const sidebar = document.getElementById('appSidebar');
    const mainContent = document.querySelector('.main-content');
    
    if (window.innerWidth < 992) {
      sidebar.classList.toggle('show-mobile');
    } else {
      sidebar.classList.toggle('collapsed');
      if (mainContent) {
        mainContent.classList.toggle('expanded');
      }
    }
  }

  function logout() {
    google.script.run.withSuccessHandler(() => {
      window.top.location.href = "<?= scriptUrl ?>";
    }).logoutSession("<?= token ?>");
  }
</script>
