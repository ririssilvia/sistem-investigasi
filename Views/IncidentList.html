<!DOCTYPE html>

<head>

  <title>Data Laporan - HSE Portal Sinarmas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body{background:#fff!important;color:#1a1a1a;font-family:'Segoe UI',sans-serif;overflow-x:hidden;margin:0;padding:0}
    .main-content{margin-left:260px!important;padding:30px 40px;transition:margin-left .3s ease!important;background:#fff!important;min-height:100vh}

    .glass-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;box-shadow:0 4px 12px rgba(0,0,0,.03);margin-bottom:24px}
    .table-sinarmas{width:100%;border-collapse:separate;border-spacing:0}
    .table-sinarmas th{background:#e31e24;color:#fff;padding:12px 16px;font-size:13px;font-weight:700;border:none;white-space:nowrap}
    .table-sinarmas td{padding:12px 16px;border-bottom:1px solid #e2e8f0;font-size:13px;vertical-align:middle;background:#fff}
    .table-sinarmas tbody tr:hover td{background:#fff0f1}
    .btn-sinarmas{background:#e31e24;color:#fff;font-weight:600;border:none;padding:10px 20px;border-radius:8px;text-decoration:none}
    .btn-sinarmas:hover{background:#b81419;color:#fff}

    .btn-export:hover{background:#157347;color:#fff}

    .pagination-wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid #e2e8f0}
    .page-size-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b}
    .page-size-wrap select{width:82px}
    .pagination .page-link{color:#e31e24;border-color:#e2e8f0}
    .pagination .page-item.active .page-link{background:#e31e24;border-color:#e31e24;color:#fff}
    .pagination .page-item.disabled .page-link{color:#94a3b8;background:#f8fafc}
    @media(max-width:991px){.main-content{margin-left:0!important;padding:20px}.main-content.mini-content{margin-left:0!important}}
  </style>
</head>
<body>
  <?!= include('Sidebar', {scriptUrl:scriptUrl, token:token, page:'IncidentList', userName:userName, userSite:userSite, userRole:userRole}); ?>
  <div class="main-content" id="mainContent">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom gap-3 flex-wrap">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-outline-danger border-0 p-2 fs-4" onclick="toggleSidebar()" title="Perkecil/Perbesar Sidebar"><i class="bi bi-list"></i></button>
        <div><h3 class="fw-bold mb-0 text-dark">Data Laporan Insiden</h3><small class="text-muted">Menampilkan daftar laporan untuk Site: <strong><?= userSite ?></strong></small></div>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn-export" id="btnExport" onclick="exportExcel()"><i class="bi bi-file-earmark-excel me-1"></i> Export Excel</button>
        <a href="<?= scriptUrl ?>?token=<?= token ?>&page=IncidentInput" class="btn btn-sinarmas">+ Buat Laporan Baru</a>
      </div>
    </div>
    <div class="glass-card mb-4">
      <div class="row g-3">
        <div class="col-12"><label class="filter-label mb-1">Pencarian Cepat</label><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span><input type="text" id="searchInput" class="form-control form-control-search" placeholder="Cari No Insiden, Perusahaan, Karyawan, atau Kronologis..."></div></div>
        <div class="col-md-3"><label class="filter-label mb-1">Start Date</label><input type="date" id="startDate" class="form-control form-control-date"></div>
        <div class="col-md-3"><label class="filter-label mb-1">End Date</label><input type="date" id="endDate" class="form-control form-control-date"></div>
        <div class="col-md-3"><label class="filter-label mb-1">Site</label><select id="filterSite" class="form-select form-select-filter"><option value="">-- Semua Site --</option></select></div>
        <div class="col-md-3"><label class="filter-label mb-1">Status Laporan</label><select id="filterStatus" class="form-select form-select-filter"><option value="">-- Semua Status --</option></select></div>
        <div class="col-12 d-flex justify-content-end gap-2"><button type="button" class="btn btn-outline-secondary" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise me-1"></i> Reset Filter</button><button type="button" class="btn btn-danger" onclick="loadData()"><i class="bi bi-funnel me-1"></i> Terapkan Filter</button></div>
      </div>
    </div>
    <div class="glass-card">
      <div class="d-flex justify-content-between align-items-center mb-3"><div class="fw-bold">Daftar Laporan</div><small class="text-muted" id="totalInfo">Memuat...</small></div>
      <div class="table-responsive"><table class="table-sinarmas"><thead><tr><th>No Insiden</th><th>Tanggal</th><th>Site</th><th>Perusahaan</th><th>Klasifikasi</th><th>Karyawan</th><th>Status</th><th class="text-center">Aksi</th></tr></thead><tbody id="listTableBody"><tr><td colspan="8" class="text-center text-muted loading-row">Memuat data laporan insiden...</td></tr></tbody></table></div>
      <div class="pagination-wrap" id="paginationWrap" style="display:none"><div class="page-size-wrap"><span>Tampilkan</span><select id="pageSize" class="form-select form-select-sm"><option value="5" selected>5</option><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select><span>data per halaman</span></div><div class="small text-muted" id="pageInfo"></div><nav aria-label="Pagination"><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav></div>
    </div>
  </div>
<script>
const TOKEN=<?= JSON.stringify(token) ?>;
const SCRIPT_URL=<?= JSON.stringify(scriptUrl) ?>;
let ALL_DATA=[],HEADERS=[],IDX={id:-1,date:-1,site:-1,company:-1,status:-1,classification:-1,employee:-1,chronology:-1},IS_LOADING=false,CURRENT_PAGE=1,PAGE_SIZE=5,GROUPED_DATA=[];
window.addEventListener('DOMContentLoaded',()=>{document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')loadData()});document.getElementById('pageSize').addEventListener('change',()=>{PAGE_SIZE=parseInt(document.getElementById('pageSize').value,10)||5;CURRENT_PAGE=1;renderCurrentPage()});loadData()});
function normalizeHeader(v){return String(v||'').trim().toLowerCase().replace(/[\s_\-\/]+/g,' ')}
function findIdx(candidates){const h=HEADERS.map(normalizeHeader),c=candidates.map(normalizeHeader);for(const x of c){const i=h.indexOf(x);if(i!==-1)return i}for(let i=0;i<h.length;i++)if(c.some(x=>x&&(h[i].includes(x)||x.includes(h[i]))))return i;return -1}
function findCompanyIdx(){let i=findIdx(['Perusahaan','Nama Perusahaan','Perusahaan Terlibat','Nama Perusahaan Terlibat','Perusahaan Karyawan','Perusahaan/Kontraktor','Company','Company Name']);if(i!==-1)return i;return HEADERS.map(normalizeHeader).findIndex(x=>x.includes('perusahaan')||x.includes('company'))}
function buildIndices(){IDX.id=findIdx(['Nomor Insiden','No Insiden','No. Insiden','ID Insiden','Incident Number']);IDX.date=findIdx(['Tanggal Kejadian','Tanggal','Date of Incident','Incident Date']);IDX.site=findIdx(['Site/Business Unit (BU)','Site','Business Unit','Business Unit (BU)']);IDX.company=findCompanyIdx();IDX.status=findIdx(['Status Laporan','Status','Status Incident','Status Insiden']);IDX.classification=findIdx(['Klasifikasi','Klasifikasi Insiden','Klasifikasi Kecelakaan','Classification']);IDX.employee=findIdx(['Karyawan','Nama Karyawan','Nama Karyawan Terlibat','Employee']);IDX.chronology=findIdx(['Kronologis','Uraian Kronologis Kejadian','Kronologi'])}
function val(row,idx,def='-'){const v=idx>=0?row[idx]:'';return v===null||v===undefined||String(v).trim()===''?def:v}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function formatDate(v){if(!v)return '-';const d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleDateString('id-ID')}
function parseRpcResponse(raw){if(raw===null||raw===undefined||raw==='')return null;if(typeof raw==='object')return raw;try{return JSON.parse(String(raw))}catch(e){throw new Error('Response server bukan JSON yang valid: '+e.message)}}
function loadData(){if(IS_LOADING)return;IS_LOADING=true;setLoading(true,'Memuat data laporan insiden...');const filters={search:document.getElementById('searchInput').value.trim(),startDate:document.getElementById('startDate').value,endDate:document.getElementById('endDate').value,site:document.getElementById('filterSite').value,status:document.getElementById('filterStatus').value};google.script.run.withSuccessHandler(raw=>{IS_LOADING=false;let res;try{res=parseRpcResponse(raw)}catch(e){showError(e.message);return}if(!res){showError('Server tidak mengembalikan response.');return}if(res.success!==true){showError(res.message||'Gagal memuat data laporan.');return}HEADERS=res.headers||[];buildIndices();ALL_DATA=res.rows||[];GROUPED_DATA=groupRows(ALL_DATA);CURRENT_PAGE=1;populateFilters(res.filterOptions||{});renderCurrentPage()}).withFailureHandler(err=>{IS_LOADING=false;showError('Gagal memuat data: '+(err&&err.message?err.message:err))}).getFilteredIncidents(TOKEN,filters)}
function populateFilters(options){const site=document.getElementById('filterSite'),status=document.getElementById('filterStatus'),currentSite=site.value,currentStatus=status.value,sites=options.sites||[],statuses=options.statuses||[];site.innerHTML='<option value="">-- Semua Site --</option>'+sites.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');status.innerHTML='<option value="">-- Semua Status --</option>'+statuses.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');if(sites.includes(currentSite))site.value=currentSite;if(statuses.includes(currentStatus))status.value=currentStatus}
function groupRows(rows){const map=new Map();rows.forEach(row=>{const id=String(val(row,IDX.id,'')),key=id||JSON.stringify(row);if(!map.has(key))map.set(key,{row:row,count:0});map.get(key).count++});return Array.from(map.values())}
function renderCurrentPage(){const totalTransactions=ALL_DATA.length,totalReports=GROUPED_DATA.length,totalPages=Math.max(1,Math.ceil(totalReports/PAGE_SIZE));if(CURRENT_PAGE>totalPages)CURRENT_PAGE=totalPages;const start=(CURRENT_PAGE-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,totalReports);displayRows(GROUPED_DATA.slice(start,end));document.getElementById('totalInfo').textContent=totalTransactions+' baris transaksi / '+totalReports+' laporan';renderPagination(totalReports,totalPages,start,end)}
function renderPagination(total,totalPages,start,end){const wrap=document.getElementById('paginationWrap'),ul=document.getElementById('pagination'),info=document.getElementById('pageInfo');if(total<=PAGE_SIZE){wrap.style.display=total?'flex':'none';ul.innerHTML='';info.textContent=total?'Menampilkan '+(start+1)+'–'+end+' dari '+total+' laporan':'';return}wrap.style.display='flex';info.textContent='Menampilkan '+(start+1)+'–'+end+' dari '+total+' laporan';let html=`<li class="page-item ${CURRENT_PAGE===1?'disabled':''}"><button class="page-link" type="button" onclick="goPage(${CURRENT_PAGE-1})">‹</button></li>`;const pages=[];for(let p=1;p<=totalPages;p++){if(p===1||p===totalPages||Math.abs(p-CURRENT_PAGE)<=1)pages.push(p);else if(p===CURRENT_PAGE-2||p===CURRENT_PAGE+2)pages.push('...')}let last='';pages.forEach(p=>{if(p==='...'&&last==='...')return;if(p==='...')html+='<li class="page-item disabled"><span class="page-link">…</span></li>';else html+=`<li class="page-item ${p===CURRENT_PAGE?'active':''}"><button class="page-link" type="button" onclick="goPage(${p})">${p}</button></li>`;last=p});html+=`<li class="page-item ${CURRENT_PAGE===totalPages?'disabled':''}"><button class="page-link" type="button" onclick="goPage(${CURRENT_PAGE+1})">›</button></li>`;ul.innerHTML=html}
function goPage(page){const totalPages=Math.max(1,Math.ceil(GROUPED_DATA.length/PAGE_SIZE));if(page<1||page>totalPages)return;CURRENT_PAGE=page;renderCurrentPage()}
function displayRows(groups){const tbody=document.getElementById('listTableBody');tbody.innerHTML='';if(!groups.length){tbody.innerHTML='<tr><td colspan="8" class="text-center py-4 text-muted">Data laporan tidak ditemukan.</td></tr>';return}groups.forEach(g=>{const r=g.row,id=val(r,IDX.id),st=String(val(r,IDX.status,'Open'));let badge='bg-danger';if(st.toLowerCase()==='closed')badge='bg-success';else if(st.toLowerCase().includes('progress'))badge='bg-warning text-dark';const editUrl=SCRIPT_URL+'?token='+encodeURIComponent(TOKEN)+'&page=IncidentEdit&incident='+encodeURIComponent(id);tbody.insertAdjacentHTML('beforeend',`<tr><td class="fw-bold text-danger">${escapeHtml(id)}</td><td>${escapeHtml(formatDate(val(r,IDX.date,'')))}</td><td>${escapeHtml(val(r,IDX.site))}</td><td>${escapeHtml(val(r,IDX.company))}</td><td>${escapeHtml(val(r,IDX.classification))}</td><td>${escapeHtml(g.count+' karyawan')}</td><td><span class="badge ${badge}">${escapeHtml(st)}</span></td><td class="text-center"><a class="btn btn-sm btn-outline-danger" href="${editUrl}" title="Lihat/Edit"><i class="bi bi-eye"></i></a></td></tr>`)})}
function setLoading(on,text){if(on)document.getElementById('listTableBody').innerHTML=`<tr><td colspan="8" class="text-center text-muted loading-row"><span class="spinner-border spinner-border-sm me-2"></span>${escapeHtml(text)}</td></tr>`;if(on)document.getElementById('paginationWrap').style.display='none'}
function showError(message){document.getElementById('totalInfo').textContent='Gagal memuat';document.getElementById('paginationWrap').style.display='none';document.getElementById('listTableBody').innerHTML=`<tr><td colspan="8" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle me-1"></i>${escapeHtml(message)}</td></tr>`}
function resetFilters(){document.getElementById('searchInput').value='';document.getElementById('startDate').value='';document.getElementById('endDate').value='';document.getElementById('filterSite').value='';document.getElementById('filterStatus').value='';loadData()}
function exportExcel(){const btn=document.getElementById('btnExport'),filters={search:document.getElementById('searchInput').value.trim(),startDate:document.getElementById('startDate').value,endDate:document.getElementById('endDate').value,site:document.getElementById('filterSite').value,status:document.getElementById('filterStatus').value};btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span> Membuat Excel...';google.script.run.withSuccessHandler(raw=>{btn.disabled=false;btn.innerHTML='<i class="bi bi-file-earmark-excel me-1"></i> Export Excel';let res;try{res=parseRpcResponse(raw)}catch(e){alert(e.message);return}if(!res||res.success!==true){alert((res&&res.message)||'Gagal membuat file Excel.');return}const a=document.createElement('a');a.href=res.downloadUrl;a.target='_blank';a.rel='noopener';a.click();alert('Export berhasil: '+res.fileName+' ('+res.total+' baris transaksi).')}).withFailureHandler(err=>{btn.disabled=false;btn.innerHTML='<i class="bi bi-file-earmark-excel me-1"></i> Export Excel';alert('Gagal export Excel: '+(err&&err.message?err.message:err))}).exportIncidentExcel(TOKEN,filters)}
</script>
</body>
</html>
