<!doctype html><html><head><base target="_top"><meta charset="utf-8"><title>Detail Laporan</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"><style>body{font-family:Segoe UI,sans-serif;background:#f8fafc;color:#1f2937}.main{margin-left:260px;padding:30px 40px}.cardx{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 4px 14px #00000008}.title{font-weight:800;color:#e31e24;border-bottom:2px solid #fff0f1;padding-bottom:9px;margin-bottom:18px}.label{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:800}.value{font-size:14px;font-weight:600;margin-top:3px;white-space:pre-wrap}.timeline{border-left:2px solid #e31e24;padding-left:18px}.event{position:relative;margin-bottom:18px}.event:before{content:'';position:absolute;left:-25px;top:3px;width:10px;height:10px;background:#e31e24;border-radius:50%}@media(max-width:991px){.main{margin-left:0;padding:20px}}</style></head><body><?!= include('Sidebar',{scriptUrl:scriptUrl,token:token,page:'IncidentDetail',userName:userName,userSite:userSite,userRole:userRole}); ?><main class="main"><div class="d-flex justify-content-between align-items-center mb-4 gap-2"><div><h3 class="fw-bold mb-1">Detail Laporan Insiden</h3><small class="text-muted">Nomor: <b><?= idInsiden ?></b></small></div><div id="actions"><a class="btn btn-outline-secondary" href="<?= scriptUrl ?>?token=<?= token ?>&page=IncidentList">Kembali</a></div></div><div id="msg" class="alert alert-info">Memuat detail...</div><div id="content" style="display:none"><div class="cardx"><div class="title">Data Laporan</div><div id="fields" class="row g-4"></div></div><div class="cardx"><div class="title"><i class="bi bi-paperclip me-1"></i>Lampiran</div><div id="atts"></div></div><div class="cardx"><div class="title"><i class="bi bi-clock-history me-1"></i>History Status & Aktivitas</div><div id="history" class="timeline"></div></div></div></main><script>const T=<?= JSON.stringify(token) ?>,ID=<?= JSON.stringify(idInsiden) ?>,U=<?= JSON.stringify(scriptUrl) ?>;function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]||m))}function renderObj(o){return Object.entries(o||{}).filter(([k,v])=>String(v??'').trim()!=='').map(([k,v])=>'<div class="col-md-4"><div class="label">'+esc(k.replace(/_/g,' '))+'</div><div class="value">'+esc(v)+'</div></div>').join('')}google.script.run.withSuccessHandler(x=>{let r=typeof x==='string'?JSON.parse(x):x;if(!r.success){msg.className='alert alert-danger';msg.textContent='Gagal memuat data laporan. Silakan coba lagi.';return}let row=r.rows?.[0]||{};let fields={};(r.headers||[]).forEach((h,i)=>fields[h]=row[i]||'');fields['No Insiden']=ID;fields['Status']=r.status||'Open';fields=Object.fromEntries(Object.entries(fields).filter(([k])=>!['Timestamp','Nama Input'].includes(k)));document.getElementById('fields').innerHTML=renderObj(fields);let closed=String(r.status||'').toLowerCase()==='close'||String(r.status||'').toLowerCase()==='closed';let admin=String(r.session?.Role||'').toLowerCase()==='admin';if(!closed||admin)actions.innerHTML='<a class="btn btn-outline-warning me-1" href="'+U+'?token='+encodeURIComponent(T)+'&page=IncidentEdit&id='+encodeURIComponent(ID)+'"><i class="bi bi-pencil me-1"></i>Edit</a><a class="btn btn-outline-secondary" href="'+U+'?token='+encodeURIComponent(T)+'&page=IncidentList">Kembali</a>';let a=r.attachments||[];atts.innerHTML=a.length?a.map(o=>{let url=Object.values(o).find(v=>String(v||'').startsWith('http'));let name=o.Nama_File||o.Nama||o.File||Object.values(o).find(v=>String(v||'').includes('.'))||'Lampiran';return '<div class="d-flex justify-content-between align-items-center border rounded p-3 mb-2"><div><b>'+esc(name)+'</b><div class="small text-muted">'+esc(o.Tipe||o.jenisLampiran||'Lampiran')+'</div></div>'+(url?'<a class="btn btn-sm btn-outline-primary" target="_blank" href="'+esc(url)+'"><i class="bi bi-box-arrow-up-right me-1"></i>Lihat Lampiran</a>':'')+'</div>'}).join(''):'<div class="text-muted">Belum ada lampiran.</div>';let h=r.history||[];history.innerHTML=h.length?h.map(o=>'<div class="event"><b>'+esc(o.Status_Baru||o['Status Baru']||o.status_baru||o.Aktivitas||'Aktivitas')+'</b><div class="small text-muted">'+esc(o.Timestamp||o.Tanggal||o.Waktu||'')+' · '+esc(o.User||o.Pengguna||o.Nama||'')+'</div><div class="mt-1">'+esc(o.Catatan||o.Keterangan||'')+'</div></div>').join(''):'<div class="text-muted">Belum ada history.</div>';msg.className='alert alert-success';msg.textContent='Detail berhasil dimuat.';content.style.display='block'}).withFailureHandler(e=>{msg.className='alert alert-danger';msg.textContent='Gagal memuat data laporan. Silakan coba lagi.'}).getIncidentDetail(T,ID);</script></body></html>
