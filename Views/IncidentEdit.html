    body{background:#fff;color:#1f2937;font-family:'Segoe UI',sans-serif;overflow-x:hidden}.main-content{margin-left:260px;padding:30px 40px;min-height:100vh}.glass-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;box-shadow:0 4px 12px rgba(0,0,0,.03);margin-bottom:24px}.section-title{font-size:15px;font-weight:700;color:#e31e24;border-bottom:2px solid #fff0f1;padding-bottom:8px;margin-bottom:20px}.form-control,.form-select{border-radius:8px;border:1px solid #cbd5e1;padding:10px 14px;font-size:13.5px}.form-control:focus,.form-select:focus{border-color:#e31e24;box-shadow:0 0 0 .2rem rgba(227,30,36,.15)}.btn-sinarmas{background:#e31e24;color:#fff;font-weight:600;border:none;padding:10px 22px;border-radius:8px}.btn-sinarmas:hover{background:#b81419;color:#fff}.emp-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:12px}.emp-number{font-size:13px;font-weight:700;color:#e31e24}.loading{display:flex;align-items:center;gap:8px}.toast-container{position:fixed;right:20px;top:20px;z-index:10000}.readonly{background:#f8fafc}.required-mark{color:#e31e24}.saving{pointer-events:none;opacity:.8}@media(max-width:991px){.main-content{margin-left:0;padding:20px}}

<body>
<?!= include('Sidebar',{scriptUrl:scriptUrl,token:token,page:'IncidentEdit',userName:userName,userSite:userSite,userRole:userRole}); ?>
<main class="main-content">
  <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom gap-3 flex-wrap">
    <div class="d-flex align-items-center gap-3"><button type="button" class="btn btn-outline-danger border-0 p-2 fs-4" onclick="toggleSidebar()"><i class="bi bi-list"></i></button><div><h3 class="fw-bold mb-0">Edit Laporan Insiden</h3><small class="text-muted">No. Insiden: <strong><?= idInsiden ?></strong></small></div></div>
    <span id="statusBadge" class="badge bg-secondary">Memuat...</span>
  </div>
  <div id="message" class="alert alert-info loading"><span class="spinner-border spinner-border-sm"></span><span>Memuat data laporan...</span></div>
  <form id="editForm" style="display:none">
    <div class="glass-card"><div class="section-title"><i class="bi bi-clock-history me-2"></i>1. Informasi Utama & Waktu Kejadian</div><div id="common1" class="row g-3"></div></div>
    <div class="glass-card"><div class="section-title d-flex justify-content-between align-items-center"><span><i class="bi bi-person-badge me-2"></i>2. Entitas Perusahaan & Karyawan Terlibat</span><button type="button" id="addEmployee" class="btn btn-sm btn-outline-danger fw-bold"><i class="bi bi-person-plus me-1"></i>Tambah Karyawan</button></div><div id="employeeList"></div></div>
    <div class="glass-card"><div class="section-title"><i class="bi bi-journal-text me-2"></i>3. Kronologis & Peralatan Terlibat</div><div id="common3" class="row g-3"></div></div>
    <div class="glass-card"><div class="section-title"><i class="bi bi-search me-2"></i>4. Analisis Penyebab</div><div id="common4" class="row g-3"></div></div>
    <div class="glass-card"><div class="section-title"><i class="bi bi-shield-check me-2"></i>5. Tindakan Perbaikan, Pencegahan & Target Due Date</div><div id="common5" class="row g-3"></div></div>
    <div class="d-flex justify-content-between align-items-center pt-2"><a class="btn btn-outline-secondary fw-bold" href="<?= scriptUrl ?>?token=<?= token ?>&page=IncidentList"><i class="bi bi-arrow-left me-1"></i>Kembali</a><button type="submit" class="btn-sinarmas" id="saveButton"><i class="bi bi-check2-circle me-2"></i>Simpan Perubahan</button></div>
  </form>
</main>
<div class="toast-container" id="toastContainer"></div>
<script>
const TOKEN=<?= JSON.stringify(token) ?>, INCIDENT_ID=<?= JSON.stringify(idInsiden) ?>, SCRIPT_URL=<?= JSON.stringify(scriptUrl) ?>, USER_ROLE=<?= JSON.stringify(userRole) ?>;
let HEADERS=[],ROWS=[],IDX={},MASTER={};
const COMMON=[
 {k:'site',label:'Site / Business Unit (BU)',type:'select',master:'site',required:true},
 {k:'tgl',label:'Tanggal Kejadian',type:'date',required:true},
 {k:'hari',label:'Hari',type:'text',readonly:true},
 {k:'bulan',label:'Bulan',type:'text',readonly:true},
 {k:'jam',label:'Jam Kejadian',type:'select',master:'jam',required:true},
 {k:'shift',label:'Shift Kerja',type:'select',options:['Shift 1 (Siang)','Shift 2 (Malam)'],required:true},
 {k:'lokasi',label:'Lokasi Spesifik',type:'select',master:'lokasi',required:true}
];
const EMP=[
 {k:'perusahaan',label:'Perusahaan',type:'select',master:'perusahaan',required:true},
 {k:'departemen',label:'Departemen',type:'select',master:'departemen',required:true},
 {k:'klasifikasi',label:'Klasifikasi Kecelakaan',type:'select',master:'klasifikasi'},
 {k:'karyawan',label:'Nama Karyawan Terlibat',type:'text',required:true},
 {k:'jabatan',label:'Jabatan',type:'select',master:'jabatan'},
 {k:'umur',label:'Umur',type:'select',master:'umur'},
 {k:'masa',label:'Masa Kerja',type:'select',master:'masaKerja'}
];
const GROUPS={common3:[
 {k:'kronologis',label:'Uraian Kronologis Kejadian',type:'textarea',required:true},
 {k:'alat',label:'Kategori Alat Terlibat',type:'select',master:'kategoriAlat'},
 {k:'jenisAlat',label:'Jenis Alat',type:'select',master:'jenisAlat'},
 {k:'loss',label:'Estimasi Loss Cost ($ / Rp)',type:'number'},
 {k:'kontak',label:'Jenis Kontak',type:'select',master:'jenisKontak'},
 {k:'sumber',label:'Sumber Kecelakaan',type:'select',master:'sumberKecelakaan'}
],common4:[
 {k:'tta',label:'Tindakan Tidak Aman (TTA)',type:'select',master:'tta'},
 {k:'ketTta',label:'Keterangan TTA',type:'select',master:'ketTta'},
 {k:'kta',label:'Kondisi Tidak Aman (KTA)',type:'select',master:'kta'},
 {k:'ketKta',label:'Keterangan KTA',type:'select',master:'ketKta'},
 {k:'fm',label:'Faktor Manusia',type:'select',master:'faktorManusia'},
 {k:'ketFm',label:'Keterangan Faktor Manusia',type:'select',master:'ketFaktorManusia'},
 {k:'fp',label:'Faktor Pekerjaan',type:'select',master:'faktorPekerjaan'},
 {k:'ketFp',label:'Keterangan Faktor Pekerjaan',type:'select',master:'ketFaktorPekerjaan'},
 {k:'kk',label:'Kurang Kendali Manajemen',type:'select',master:'kurangKendali'},
 {k:'ketKk',label:'Keterangan Kurang Kendali',type:'select',master:'ketKurangKendali'}
],common5:[
 {k:'tp',label:'Tindakan Perbaikan',type:'textarea'},
 {k:'tpc',label:'Tindakan Pencegahan',type:'textarea'},
 {k:'due',label:'Target Due Date CAPA',type:'date'}
]};
const MAP={site:['Site/Business Unit (BU)','Site'],tgl:['Tanggal Kejadian','Tanggal'],hari:['Hari'],bulan:['Bulan'],jam:['Jam Kejadian'],shift:['Shift Kerja'],lokasi:['Lokasi Spesifik'],perusahaan:['Perusahaan','Perusahan'],departemen:['Departemen'],klasifikasi:['Klasifikasi Kecelakaan','Klasifikasi'],karyawan:['Karyawan Terlibat / Nama','Karyawan Terlibat','Karyawan'],jabatan:['Jabatan'],umur:['Umur'],masa:['Masa Kerja'],kronologis:['Uraian Kronologis Kejadian','Kronologis'],alat:['Kategori Alat Terlibat'],jenisAlat:['Jenis Alat'],loss:['Estimasi Loss Cost','Loss Cost'],kontak:['Jenis Kontak'],sumber:['Sumber Kecelakaan'],tta:['Tindakan Tidak Aman (TTA)','TTA'],ketTta:['Keterangan TTA'],kta:['Kondisi Tidak Aman (KTA)','KTA'],ketKta:['Keterangan KTA'],fm:['Faktor Manusia'],ketFm:['Keterangan Faktor Manusia'],fp:['Faktor Pekerjaan'],ketFp:['Keterangan Faktor Pekerjaan'],kk:['Kurang Kendali Manajemen'],ketKk:['Keterangan Kurang Kendali'],tp:['Tindakan Perbaikan'],tpc:['Tindakan Pencegahan'],due:['Target Due Date CAPA','Due Date CAPA']};
function norm(v){return String(v||'').trim().toLowerCase().replace(/[\s_\-\/]+/g,' ')}
function indexHeaders(){const h=HEADERS.map(norm);Object.keys(MAP).forEach(k=>{IDX[k]=-1;for(const c of MAP[k]){const i=h.indexOf(norm(c));if(i>=0){IDX[k]=i;break}}});IDX.status=37;IDX.completion=36}
function rowVal(row,k){return IDX[k]>=0?String(row[IDX[k]]??''):''}
function setRowVal(row,k,v){if(IDX[k]>=0)row[IDX[k]]=v??''}
function addOptions(select,items,current){select.innerHTML='<option value="">-- Pilih --</option>';(items||[]).forEach(v=>{const o=document.createElement('option');o.value=String(v);o.textContent=String(v);select.appendChild(o)});if(current!==undefined&&current!==null&&String(current)!==''){if(![...select.options].some(o=>o.value===String(current))){const o=document.createElement('option');o.value=String(current);o.textContent=String(current)+' (nilai saat ini)';select.appendChild(o)}select.value=String(current)}}
function makeField(parent,spec,value){const wrap=document.createElement('div');wrap.className=spec.type==='textarea'?'col-12':'col-md-6';const label=document.createElement('label');label.className='form-label fw-bold';label.innerHTML=spec.label+(spec.required?' <span class="required-mark">*</span>':'');wrap.appendChild(label);let el;if(spec.type==='textarea'){el=document.createElement('textarea');el.className='form-control';el.rows=4}else if(spec.type==='select'){el=document.createElement('select');el.className='form-select';const items=spec.options||MASTER[spec.master]||[];addOptions(el,items,value)}else{el=document.createElement('input');el.className='form-control';el.type=spec.type;el.value=value||''}if(spec.type!=='select'&&value!==undefined)el.value=value||'';el.dataset.key=spec.k;if(spec.required)el.required=true;if(spec.readonly){el.readOnly=true;el.classList.add('readonly')}wrap.appendChild(el);parent.appendChild(wrap);if(spec.k==='tgl')el.addEventListener('change',syncDateFields);return el}
function renderCommon(){const r=ROWS[0]||[];COMMON.forEach(s=>makeField(document.getElementById('common1'),s,rowVal(r,s.k)));Object.entries(GROUPS).forEach(([id,specs])=>specs.forEach(s=>makeField(document.getElementById(id),s,rowVal(r,s.k))));syncDateFields()}
function syncDateFields(){const date=document.querySelector('[data-key="tgl"]');if(!date||!date.value)return;const d=new Date(date.value+'T00:00:00');const hari=document.querySelector('[data-key="hari"]'),bulan=document.querySelector('[data-key="bulan"]');if(hari)hari.value=d.toLocaleDateString('id-ID',{weekday:'long'});if(bulan)bulan.value=d.toLocaleDateString('id-ID',{month:'long'})}
function renderEmployee(row){const card=document.createElement('div');card.className='emp-card';card.innerHTML='<div class="d-flex justify-content-between align-items-center mb-3"><span class="emp-number"></span><button type="button" class="btn btn-sm btn-outline-danger remove-employee"><i class="bi bi-trash me-1"></i>Hapus</button></div><div class="row g-3"></div>';const container=card.querySelector('.row');EMP.forEach(s=>makeField(container,s,rowVal(row,s.k)));card.querySelector('.remove-employee').onclick=()=>{if(document.querySelectorAll('#employeeList .emp-card').length<=1){showToast('Minimal satu karyawan harus tersedia.',false);return}card.remove();renumberEmployees()};document.getElementById('employeeList').appendChild(card);renumberEmployees()}
function renumberEmployees(){document.querySelectorAll('#employeeList .emp-card').forEach((c,i)=>c.querySelector('.emp-number').textContent='Karyawan Terlibat #'+(i+1))}
function collectRows(){const commonFields=[...document.querySelectorAll('#common1 [data-key],#common3 [data-key],#common4 [data-key],#common5 [data-key]')];const cards=[...document.querySelectorAll('#employeeList .emp-card')];return cards.map((card,i)=>{const base=[...(ROWS[i]||ROWS[0]||[])];commonFields.forEach(el=>setRowVal(base,el.dataset.key,el.value));card.querySelectorAll('[data-key]').forEach(el=>setRowVal(base,el.dataset.key,el.value));return base})}
function showToast(message,ok){const c=document.getElementById('toastContainer');c.innerHTML='<div class="alert alert-'+(ok?'success':'danger')+' shadow-sm">'+escapeHtml(message)+'</div>';setTimeout(()=>c.innerHTML='',3500)}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function setBusy(b){const btn=document.getElementById('saveButton');btn.disabled=b;btn.classList.toggle('saving',b);btn.innerHTML=b?'<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...':'<i class="bi bi-check2-circle me-2"></i>Simpan Perubahan'}
function load(){google.script.run.withSuccessHandler(raw=>{const res=typeof raw==='string'?JSON.parse(raw):raw;if(!res||!res.success){document.getElementById('message').className='alert alert-danger';document.getElementById('message').textContent=res?.message||'Gagal memuat data laporan.';return}HEADERS=res.headers||[];ROWS=res.rows||[];indexHeaders();const status=String(res.status||rowVal(ROWS[0],'status')||'Open');document.getElementById('statusBadge').textContent=status.toUpperCase();document.getElementById('statusBadge').className='badge '+(status.toLowerCase()==='close'?'bg-success':'bg-warning text-dark');google.script.run.withSuccessHandler(m=>{const mr=typeof m==='string'?JSON.parse(m):m;if(!mr||!mr.success){showToast(mr?.message||'Master Data gagal dimuat.',false);return}MASTER=mr.master||{};renderCommon();ROWS.forEach(r=>renderEmployee(r));document.getElementById('message').className='alert alert-success';document.getElementById('message').textContent='Data berhasil dimuat dan siap diedit.';document.getElementById('editForm').style.display='block'}).withFailureHandler(e=>showToast('Gagal memuat Master Data.',false)).getFormMasterData(TOKEN)}).withFailureHandler(e=>{document.getElementById('message').className='alert alert-danger';document.getElementById('message').textContent='Gagal memuat data laporan. Silakan coba lagi.'}).getIncidentDetailForEdit(TOKEN,INCIDENT_ID)}
document.getElementById('addEmployee').onclick=()=>renderEmployee(Array(HEADERS.length).fill(''));
document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const rows=collectRows();if(!rows.length){showToast('Minimal satu karyawan harus tersedia.',false);return}setBusy(true);google.script.run.withSuccessHandler(raw=>{setBusy(false);const r=typeof raw==='string'?JSON.parse(raw):raw;if(!r||!r.success){showToast(r?.message||'Data gagal diperbarui. Silakan coba lagi.',false);return}showToast('Data laporan berhasil diperbarui.',true);setTimeout(()=>location.href=SCRIPT_URL+'?token='+encodeURIComponent(TOKEN)+'&page=IncidentList',800)}).withFailureHandler(e=>{setBusy(false);showToast('Data gagal diperbarui. Silakan coba lagi.',false)}).updateIncidentData(TOKEN,INCIDENT_ID,rows)};
load();
</script>
</body>
</html>
